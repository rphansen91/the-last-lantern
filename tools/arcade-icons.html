<!doctype html>
<!-- Procedural Night Arcade icons: dark grainy void, cyan arcade arch / night mark. -->
<meta charset="utf-8"><title>arcade icons</title>
<body style="background:#222;margin:0;display:flex;gap:12px;flex-wrap:wrap;padding:12px">
<script>
function rnd(seed) { let s = seed >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function drawIcon(size, maskable) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), r = rnd(19);
  const k = size / 512; g.scale(k, k);
  g.fillStyle = '#05070a'; g.fillRect(0, 0, 512, 512);
  let gr = g.createRadialGradient(256, 220, 20, 256, 260, 320);
  gr.addColorStop(0, '#1a2430'); gr.addColorStop(.4, '#0c1218'); gr.addColorStop(1, '#05070a');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  // faint fog blotches
  for (let i = 0; i < 40; i++) {
    const x = r() * 512, y = 120 + r() * 320, rr = 40 + r() * 100;
    const f = g.createRadialGradient(x, y, 0, x, y, rr);
    f.addColorStop(0, 'rgba(110,200,255,.05)'); f.addColorStop(1, 'rgba(110,200,255,0)');
    g.fillStyle = f; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  const s = maskable ? .78 : .92; g.save(); g.translate(256, 256); g.scale(s, s); g.translate(-256, -256);
  // arcade arch silhouette
  g.fillStyle = '#000';
  g.beginPath();
  g.moveTo(118, 420); g.lineTo(118, 230);
  g.bezierCurveTo(118, 110, 200, 70, 256, 70);
  g.bezierCurveTo(312, 70, 394, 110, 394, 230);
  g.lineTo(394, 420); g.lineTo(348, 420); g.lineTo(348, 240);
  g.bezierCurveTo(348, 150, 300, 118, 256, 118);
  g.bezierCurveTo(212, 118, 164, 150, 164, 240);
  g.lineTo(164, 420); g.closePath(); g.fill();
  // cyan glow inside the arch
  g.save(); g.globalCompositeOperation = 'screen';
  gr = g.createRadialGradient(256, 280, 4, 256, 280, 150);
  gr.addColorStop(0, 'rgba(160,230,255,.55)'); gr.addColorStop(.35, 'rgba(110,200,255,.22)'); gr.addColorStop(1, 'rgba(110,200,255,0)');
  g.fillStyle = gr; g.beginPath(); g.ellipse(256, 290, 70, 110, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  // small floating "cabinet" light bar
  gr = g.createLinearGradient(190, 300, 322, 300);
  gr.addColorStop(0, 'rgba(110,200,255,0)'); gr.addColorStop(.5, 'rgba(180,235,255,.9)'); gr.addColorStop(1, 'rgba(110,200,255,0)');
  g.fillStyle = gr; g.fillRect(190, 298, 132, 4);
  // three soft dots like cabinet buttons
  for (const [x, col] of [[220, '#6ec8ff'], [256, '#9fdcef'], [292, '#4fa3c0']]) {
    g.fillStyle = col; g.beginPath(); g.arc(x, 340, 5, 0, Math.PI * 2); g.fill();
  }
  g.restore();
  // grain
  const id = g.getImageData(0, 0, size, size), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (r() - .5) * 24;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  g.putImageData(id, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  gr = g.createRadialGradient(size / 2, size / 2, size * .28, size / 2, size / 2, size * .72);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.78)');
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const ICONS = [['icon-192.png', 192, false], ['icon-512.png', 512, false], ['icon-maskable-512.png', 512, true], ['apple-touch-icon.png', 180, false], ['favicon-32.png', 32, false]];
window.renderAll = () => ICONS.map(([name, size, m]) => { const c = drawIcon(size, m); document.body.appendChild(c); return { name, data: c.toDataURL('image/png') }; });
if (!navigator.webdriver) renderAll();
</script>
