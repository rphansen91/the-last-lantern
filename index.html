<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Night Arcade — a dark, grainy library of small mobile games.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Arcade">
<title>Night Arcade — Library</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="shell">
    <header class="masthead" id="mast"></header>
    <main class="grid" id="grid" aria-live="polite"></main>
    <p class="foot">Night Arcade is a zero-dependency shell. Each game lives under <code>games/&lt;slug&gt;/</code> and is listed in <code>catalog.json</code>. Browser back (or the in-game ← Library chip) returns here.</p>
  </div>
  <div class="sheet-backdrop" id="backdrop" aria-hidden="true"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Game details"></aside>
  <script src="app.js?v=8" defer></script>
</body>
</html>
