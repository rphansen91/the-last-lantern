<!doctype html><meta charset="utf-8"><title>bayshift icons</title>
<script>
window.renderAll = function () {
  const sizes = [
    { name: 'icon-192.png', s: 192, pad: 0.12 },
    { name: 'icon-512.png', s: 512, pad: 0.12 },
    { name: 'icon-maskable-512.png', s: 512, pad: 0.18 },
    { name: 'apple-touch-icon.png', s: 180, pad: 0.12 },
    { name: 'favicon-32.png', s: 32, pad: 0.1 }
  ];
  const out = [];
  for (const { name, s, pad } of sizes) {
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, s, s);
    g.addColorStop(0, '#121826');
    g.addColorStop(1, '#080a10');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    // soft amber glow
    const rg = ctx.createRadialGradient(s*0.5, s*0.4, 0, s*0.5, s*0.5, s*0.55);
    rg.addColorStop(0, 'rgba(255,180,84,0.28)');
    rg.addColorStop(1, 'transparent');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, s, s);
    const m = s * pad;
    const cell = (s - m * 2) / 3;
    // mini board with crate + door
    function roundRect(x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
    }
    // floor
    roundRect(m, m, s-2*m, s-2*m, s*0.08);
    ctx.fillStyle = '#151c2a';
    ctx.fill();
    // door (right)
    roundRect(m + cell*2 + 4, m + cell + 4, cell - 8, cell - 8, cell*0.18);
    ctx.strokeStyle = '#ffb454';
    ctx.lineWidth = Math.max(2, s/64);
    ctx.setLineDash([s/40, s/50]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffb454';
    ctx.beginPath();
    const cx = m + cell*2.5, cy = m + cell*1.5;
    ctx.moveTo(cx, cy - cell*0.18); ctx.lineTo(cx + cell*0.14, cy + cell*0.12); ctx.lineTo(cx - cell*0.14, cy + cell*0.12);
    ctx.fill();
    // crate
    roundRect(m + 6, m + cell + 6, cell - 12, cell - 12, cell*0.2);
    ctx.fillStyle = '#3ecfc4';
    ctx.shadowColor = 'rgba(62,207,196,0.6)';
    ctx.shadowBlur = s/20;
    ctx.fill();
    ctx.shadowBlur = 0;
    // accent bar
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    roundRect(m + 10, m + cell + 10, cell - 20, (cell-12)*0.28, 4);
    ctx.fill();
    out.push({ name, data: c.toDataURL('image/png') });
  }
  return out;
};
</script>
